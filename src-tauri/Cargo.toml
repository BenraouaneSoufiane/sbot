[package]
name = "sbot"
version = "0.1.0"
description = "Rust web server for the sbot workspace"
authors = ["sbot"]
edition = "2021"

[lib]
name = "sbot_lib"
crate-type = ["rlib"]

[dependencies]
axum = "0.8"
hex = "0.4"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "net", "process", "rt-multi-thread", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
dotenvy = "0.15"
tower-http = { version = "0.6", features = ["fs", "trace"] }
